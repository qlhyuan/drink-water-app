services:
  drink-water:
    image: ghcr.io/qlhyuan/drink-water-app:latest
    # 如需本地构建，注释掉 image 行，取消下面注释：
    # build: .
    container_name: drink-water
    restart: unless-stopped
    ports:
      - "8080:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "file:/app/server/data/prod.db"
      JWT_SECRET: "${JWT_SECRET:-please-change-me-in-production}"
      CORS_ORIGIN: "${CORS_ORIGIN:-}"
    volumes:
      - drink-water-data:/app/server/data

volumes:
  drink-water-data: