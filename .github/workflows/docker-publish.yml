name: Build & Push Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:  # 允许手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 阿里云 ACR 配置（未设置 secrets 时为空，自动跳过阿里云推送）
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 阿里云容器镜像服务登录（需先在 GitHub Secrets 配置 ALIYUN_* 三个值）
      - name: Login to Aliyun ACR
        if: env.ALIYUN_REGISTRY != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 同时推送到 GHCR（主仓库）和阿里云 ACR（国内加速，配了 secrets 才推）
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.ALIYUN_REGISTRY != '' && format('{0}/{1}/drink-water-app:latest', secrets.ALIYUN_REGISTRY, secrets.ALIYUN_NAMESPACE) || '' }}
            ${{ secrets.ALIYUN_REGISTRY != '' && format('{0}/{1}/drink-water-app:{2}', secrets.ALIYUN_REGISTRY, secrets.ALIYUN_NAMESPACE, github.sha) || '' }}
          # 关键修复：强制使用 Docker Schema 2 manifest（oci-mediatypes=false），
          # 避免 buildx 默认推送 application/vnd.oci.empty.v1+json 多镜像占位 manifest，
          # 该格式阿里云 ACR 不识别（denied: unknown manifest class）。
          outputs: type=image,push=true,oci-mediatypes=false
          # 关闭 provenance/sbom：避免额外 attestations manifest（也是 OCI 格式，会被 ACR 拒）
          provenance: false
          sbom: false
          # 之前 cache-from: type=gha 在 buildx 5+ 上会回退到从 ghcr.io 拉 cache 镜像，
          # 触发 "denied: denied"（匿名读私有 namespace 被拒）。直接关掉 cache，
          # 镜像 build 只需 ~1 分钟，缓存收益不大。
          cache-from: ""
          cache-to: ""
