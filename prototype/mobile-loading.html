<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
  .page { padding: 0 16px 16px; background: var(--bg); min-height: 100%; }
  /* 骨架屏通用 */
  .skel { background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skel-circle { border-radius: 50%; }
  .skel-block { border-radius: 12px; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0 12px; }
  .header .skel { height: 24px; width: 100px; }
  .header .skel-circle { width: 36px; height: 36px; }
  .progress-card { background: white; border-radius: 16px; padding: 24px 16px; display: flex; align-items: center; margin-bottom: 16px; }
  .progress-card .skel-circle { width: 100px; height: 100px; flex-shrink: 0; }
  .progress-card .info { flex: 1; margin-left: 16px; }
  .progress-card .info .skel { height: 12px; margin-bottom: 8px; }
  .progress-card .info .skel:nth-child(1) { width: 60%; }
  .progress-card .info .skel:nth-child(2) { width: 80%; height: 16px; }
  .progress-card .info .skel:nth-child(3) { width: 50px; height: 22px; border-radius: 999px; }
  .section { margin-bottom: 20px; }
  .section .skel { height: 14px; width: 80px; margin-bottom: 12px; }
  .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .quick-grid .skel-block { height: 76px; }
  .cup-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cup-grid .skel-block { height: 76px; }
  .records .skel-block { height: 56px; margin-bottom: 8px; border-radius: 12px; }
  /* 加载提示 */
  .loading-tip { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,0,0,0.7); color: white; padding: 12px 20px; border-radius: 12px; backdrop-filter: blur(8px); font-size: 13px; }
  .spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .label { font-size: 11px; color: var(--text-tertiary); margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<div class="page" style="position:relative;">
  <div class="header">
    <div>
      <div class="skel" style="width:60px;height:11px;margin-bottom:6px;"></div>
      <div class="skel" style="width:100px;height:18px;"></div>
    </div>
    <div class="skel skel-circle"></div>
  </div>

  <div class="progress-card">
    <div class="skel skel-circle"></div>
    <div class="info">
      <div class="skel"></div>
      <div class="skel"></div>
      <div class="skel"></div>
    </div>
  </div>

  <div class="section">
    <div class="skel"></div>
    <div class="quick-grid">
      <div class="skel skel-block"></div>
      <div class="skel skel-block"></div>
      <div class="skel skel-block"></div>
    </div>
  </div>

  <div class="section">
    <div class="skel"></div>
    <div class="cup-grid">
      <div class="skel skel-block"></div>
      <div class="skel skel-block"></div>
      <div class="skel skel-block"></div>
      <div class="skel skel-block"></div>
    </div>
  </div>

  <div class="section">
    <div class="skel"></div>
    <div class="records">
      <div class="skel skel-block"></div>
      <div class="skel skel-block"></div>
      <div class="skel skel-block"></div>
    </div>
  </div>

  <div class="loading-tip">
    <div class="spinner"></div>
    正在加载数据...
  </div>

  <div class="label">↓ 首页骨架屏（加载状态） ↓</div>
</div>
</body>
</html>
