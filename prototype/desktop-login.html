<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 760px; background: linear-gradient(135deg, #ecfdf5 0%, #ffffff 100%); padding: 20px; }
  .login-card { background: white; border-radius: 20px; padding: 48px 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); width: 400px; }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo-icon { font-size: 64px; }
  .logo-text { font-size: 24px; font-weight: 700; margin-top: 8px; }
  .logo-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 13px; font-weight: 500; margin-bottom: 6px; display: block; }
  .form-input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .form-input:focus { border-color: var(--brand); }
  .submit-btn { width: 100%; background: linear-gradient(135deg, var(--brand), var(--brand-dark)); color: white; border: 0; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 600; box-shadow: var(--shadow-brand); cursor: pointer; margin-top: 24px; }
  .switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-secondary); }
  .switch a { color: var(--brand); text-decoration: none; font-weight: 500; }
  .features { display: flex; justify-content: space-around; margin-top: 32px; padding-top: 24px; border-top: 1px solid #f3f4f6; }
  .feature { text-align: center; font-size: 11px; color: var(--text-secondary); }
  .feature-icon { font-size: 24px; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">💧</div>
      <div class="logo-text">每日喝水</div>
      <div class="logo-sub">让喝水变成习惯</div>
    </div>
    <div class="form-group">
      <label class="form-label">用户名</label>
      <input type="text" class="form-input" placeholder="请输入用户名" value="drinkuser">
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input type="password" class="form-input" placeholder="请输入密码" value="********">
    </div>
    <button class="submit-btn">登 录</button>
    <div class="switch">还没有账号？<a href="#">立即注册</a></div>
    <div class="features">
      <div class="feature"><div class="feature-icon">💧</div>轻松记录</div>
      <div class="feature"><div class="feature-icon">🔔</div>智能提醒</div>
      <div class="feature"><div class="feature-icon">🏆</div>成就解锁</div>
    </div>
  </div>
</body>
</html>
