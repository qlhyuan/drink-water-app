<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
  .page { padding: 0 16px 80px; background: var(--bg); min-height: 100%; }
  .topbar { display: flex; align-items: center; padding: 14px 0; }
  .back { font-size: 18px; margin-right: 12px; }
  .topbar-title { font-size: 16px; font-weight: 600; }
  .hero { background: linear-gradient(135deg, var(--brand), var(--brand-dark)); border-radius: 20px; padding: 28px 16px; text-align: center; color: white; box-shadow: var(--shadow-brand); margin-bottom: 16px; }
  .hero-title { font-size: 14px; opacity: 0.9; }
  .hero-percent { font-size: 48px; font-weight: 700; line-height: 1.1; margin: 8px 0; }
  .hero-desc { font-size: 13px; opacity: 0.9; margin-bottom: 12px; }
  .progress-bar { height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: white; width: 40%; border-radius: 3px; }
  .card { background: white; border-radius: 16px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .item { background: #f8fafc; border-radius: 12px; padding: 12px 8px; text-align: center; position: relative; border: 2px solid transparent; }
  .item.unlocked { background: #ecfdf5; border-color: var(--brand); }
  .item.locked { opacity: 0.5; }
  .item-icon { font-size: 32px; }
  .item-title { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .item-desc { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
  .badge { position: absolute; top: 4px; right: 4px; width: 16px; height: 16px; background: var(--brand); color: white; border-radius: 50%; font-size: 10px; display: flex; align-items: center; justify-content: center; }
  .lock { position: absolute; top: 4px; right: 4px; font-size: 12px; }
  .tabbar { position: absolute; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 10px 0 18px; box-shadow: 0 -2px 8px rgba(0,0,0,0.06); border-top: 1px solid #f3f4f6; }
  .tab { text-align: center; font-size: 11px; color: var(--text-tertiary); }
  .tab.active { color: var(--brand); }
  .tab-icon { font-size: 20px; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="back">‹</div>
    <div class="topbar-title">成就</div>
  </div>

  <div class="hero">
    <div class="hero-title">🏆 我的成就</div>
    <div class="hero-percent">40%</div>
    <div class="hero-desc">已解锁 4 / 10</div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>

  <div class="card">
    <div class="card-title">成就墙</div>
    <div class="grid">
      <div class="item unlocked">
        <div class="item-icon">🥉</div>
        <div class="item-title">连续 3 天</div>
        <div class="item-desc">坚持 3 天</div>
        <div class="badge">✓</div>
      </div>
      <div class="item unlocked">
        <div class="item-icon">🥈</div>
        <div class="item-title">连续 7 天</div>
        <div class="item-desc">坚持一周</div>
        <div class="badge">✓</div>
      </div>
      <div class="item locked">
        <div class="item-icon">🥇</div>
        <div class="item-title">连续 30 天</div>
        <div class="item-desc">坚持一个月</div>
        <div class="lock">🔒</div>
      </div>
      <div class="item locked">
        <div class="item-icon">💎</div>
        <div class="item-title">连续 100 天</div>
        <div class="item-desc">百日坚持</div>
        <div class="lock">🔒</div>
      </div>
      <div class="item unlocked">
        <div class="item-icon">💧</div>
        <div class="item-title">累计 100L</div>
        <div class="item-desc">百升水</div>
        <div class="badge">✓</div>
      </div>
      <div class="item locked">
        <div class="item-icon">🌊</div>
        <div class="item-title">累计 1000L</div>
        <div class="item-desc">千升水</div>
        <div class="lock">🔒</div>
      </div>
      <div class="item unlocked">
        <div class="item-icon">🌅</div>
        <div class="item-title">早起族</div>
        <div class="item-desc">7 天 8 点前</div>
        <div class="badge">✓</div>
      </div>
      <div class="item locked">
        <div class="item-icon">🌙</div>
        <div class="item-title">夜归人</div>
        <div class="item-desc">7 天 22 点后</div>
        <div class="lock">🔒</div>
      </div>
      <div class="item locked">
        <div class="item-icon">⚡</div>
        <div class="item-title">极速补水</div>
        <div class="item-desc">1 小时喝 1000ml</div>
        <div class="lock">🔒</div>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><div class="tab-icon">💧</div>首页</div>
    <div class="tab"><div class="tab-icon">📊</div>历史</div>
    <div class="tab active"><div class="tab-icon">🏆</div>成就</div>
    <div class="tab"><div class="tab-icon">👤</div>我的</div>
  </div>
</div>
</body>
</html>
