<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="common.css">
<style>
  .page { padding: 0 24px 32px; background: linear-gradient(180deg, #ecfdf5 0%, #ffffff 60%); min-height: 100%; }
  .brand-hero { padding: 48px 0 24px; text-align: center; }
  .brand-logo { font-size: 56px; margin-bottom: 12px; }
  .brand-title { font-size: 24px; font-weight: 700; color: var(--text); }
  .brand-sub { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
  .step-indicator { display: flex; justify-content: center; gap: 6px; margin: 20px 0 28px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #e5e7eb; }
  .dot.active { width: 24px; background: var(--brand); border-radius: 4px; }
  .step-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 6px; }
  .step-desc { font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 20px; }
  .input-card { background: white; border-radius: 14px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .input-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .input-label .value { color: var(--brand); font-weight: 700; font-size: 14px; }
  .input-row { display: flex; align-items: center; gap: 12px; }
  .input-row input[type=range] { flex: 1; accent-color: var(--brand); }
  .input-row .num { font-size: 28px; font-weight: 700; min-width: 80px; text-align: right; }
  .input-row .num small { font-size: 13px; color: var(--text-secondary); font-weight: 400; }
  .option-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .opt { background: white; border-radius: 12px; padding: 12px 8px; text-align: center; box-shadow: var(--shadow); border: 2px solid transparent; }
  .opt.active { border-color: var(--brand); background: var(--brand-light); }
  .opt-emoji { font-size: 22px; }
  .opt-name { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .opt-meta { font-size: 10px; color: var(--text-secondary); }
  .result-card { background: linear-gradient(135deg, var(--brand), var(--brand-dark)); border-radius: 16px; padding: 20px; color: white; text-align: center; margin: 20px 0 24px; box-shadow: var(--shadow-brand); }
  .result-label { font-size: 12px; opacity: 0.85; }
  .result-value { font-size: 40px; font-weight: 700; margin: 4px 0; }
  .result-value small { font-size: 16px; font-weight: 400; }
  .result-tip { font-size: 12px; opacity: 0.9; }
  .btn-primary { width: 100%; background: linear-gradient(135deg, var(--brand), var(--brand-dark)); color: white; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; border: 0; box-shadow: var(--shadow-brand); }
  .btn-text { width: 100%; background: transparent; color: var(--text-secondary); font-size: 13px; padding: 12px; border: 0; }
  .feature-list { background: white; border-radius: 12px; padding: 16px; box-shadow: var(--shadow); margin-top: 16px; }
  .feature { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; }
  .feature-emoji { font-size: 18px; }
  .skip-link { position: absolute; top: 12px; right: 16px; font-size: 12px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="page" style="position:relative;">
  <div class="skip-link">跳过</div>
  <div class="brand-hero">
    <div class="brand-logo">💧</div>
    <div class="brand-title">欢迎使用每日喝水</div>
    <div class="brand-sub">让喝水变成一种习惯</div>
  </div>

  <div class="step-indicator">
    <div class="dot active"></div>
    <div class="dot active"></div>
    <div class="dot active"></div>
  </div>

  <div class="step-title">告诉我们一些基本信息</div>
  <div class="step-desc">我们将据此智能推荐你的每日饮水目标</div>

  <div class="input-card">
    <div class="input-label">体重 <span class="value">65 kg</span></div>
    <div class="input-row">
      <input type="range" min="30" max="150" value="65">
      <div class="num">65<small>kg</small></div>
    </div>
  </div>

  <div class="input-card">
    <div class="input-label">活动水平</div>
    <div class="option-grid">
      <div class="opt"><div class="opt-emoji">🪑</div><div class="opt-name">久坐</div><div class="opt-meta">办公室</div></div>
      <div class="opt active"><div class="opt-emoji">🚶</div><div class="opt-name">轻度</div><div class="opt-meta">偶尔运动</div></div>
      <div class="opt"><div class="opt-emoji">🏃</div><div class="opt-name">高强度</div><div class="opt-meta">每天运动</div></div>
    </div>
  </div>

  <div class="input-card">
    <div class="input-label">工作环境</div>
    <div class="option-grid">
      <div class="opt"><div class="opt-emoji">❄️</div><div class="opt-name">空调房</div></div>
      <div class="opt active"><div class="opt-emoji">🌤️</div><div class="opt-name">常温</div></div>
      <div class="opt"><div class="opt-emoji">☀️</div><div class="opt-name">户外</div></div>
    </div>
  </div>

  <div class="result-card">
    <div class="result-label">为你推荐的每日饮水目标</div>
    <div class="result-value">2200<small>ml</small></div>
    <div class="result-tip">≈ 9 杯 · 可随时调整</div>
  </div>

  <button class="btn-primary">开始记录 →</button>
  <button class="btn-text">稍后设置</button>

  <div class="feature-list">
    <div class="feature"><span class="feature-emoji">🎯</span> 智能推荐目标量</div>
    <div class="feature"><span class="feature-emoji">🔔</span> 定时提醒喝水</div>
    <div class="feature"><span class="feature-emoji">📊</span> 图表分析饮水习惯</div>
    <div class="feature"><span class="feature-emoji">🏆</span> 解锁成就徽章</div>
  </div>
</div>
</body>
</html>
